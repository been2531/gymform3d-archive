# Exercise config for tools/rig3d/pipeline.py (0 generations). Edit here; every stage re-runs only if its inputs change.
slug: db_row
module: pull_row          # motion primitive (modules/pull_row.yaml); this file still wins on conflict
name: Dumbbell Row            # on-screen title (Day 4 Kaushan title)
source:
  provider: YMove
  page: https://ymove.app/free-exercise-videos
  url: https://ymove.app/api/free/d3fece95-c7e2-4794-ba8f-65a5b3e30a28
  file: _scratch/motion_src/ymove_sa_row.mp4     # gitignored: third-party clip never committed
  licence: "YMove free licence: commercial use incl. social media OK, no resale/redistribution of the videos; we use only the extracted pose"
  min_bytes: 200000
asset:
  glb: _scratch/assets_probe/human-muscles-rigged.glb   # Grab3D Human Muscles, CC0 1.0
  hdri:
    name: studio_small_09           # Poly Haven, CC0
    url: https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr
    file: _scratch/hdri/studio_small_09_1k.hdr       # gitignored
    strength: 0.55
motion:
  rep: auto                  # auto = the first full rep (bottom -> bottom) of the working elbow
  rep_index: 0
  torso_target_deg: 49       # forward hinge from vertical; upper body re-aimed per frame, arms keep their world direction
  torso_smooth_sigma_f: 4.0
  smooth_sigma_f: 2.5
  lock_feet: true
  spine_influence: 0.5      # spreads the hinge over Spine/Spine01/Spine02 (1.0 stretched 0.58% of edges >2x at the lats)
  spine_aim: far             # v4: spine bones aim 3 torso lengths out along hip->shoulder (legacy shmid: chest swung 7-65 deg)
  neck_mode: spine_follow    # v4: neck aimed along the torso line + gaze_ext_deg, Head keeps its rest relation (legacy: ears_track)
  gaze_ext_deg: 4            # head tipped back from the spine line (neutral neck, eyes on the floor ahead of the hands)
  legs: planted              # v4: both feet flat, constant, knees solved per frame from rig lengths (legacy: source)
  knee_target_deg: 160      # soft static knee: hips + upper body raised rigidly until the rig knee reaches it
  balance_knees: true        # v5: each ankle slides fore-aft until its own knee reaches knee_target_deg (no locked rear leg)
  grip_mode: palm_neutral    # v5: handle across the palm (hand-mesh axis) + forearm/hand twisted to a neutral grip (legacy shoulder_line)
  grip_twist_forearm_share: 0.6
  grip_wrap:                 # v6: power grip shape key (tools/rig3d/hand_grip.py): fingers wrap the handle, thumb opposes
    enabled: true
    handle_r_m: 0.016
    clear_m: 0.002
    max_wrap_deg: 250
    mcp_back_m: 0.015        # bend starts this far proximal to the finger web (knuckle line)
  support_elbow_mode: back_out # v6: support elbow points back/out (v5 'lateral' hyperextended it -10 deg)
  support_wrist_neutral: true  # v6: hand continues the forearm onto the thigh (v5: 58 deg wrist bend)
  support_hand_lift_m: 0.075 # support wrist target above the thigh bone line (thigh radius + hand)
  wrist_neutral: true        # v5: working hand not aimed at the index landmark (MediaPipe curled the wrist up to 77 deg)
  support_hand: front_thigh  # v5: free hand braced on the front thigh above the knee
  lock_hips: true            # v5: pelvis static over the rep (upper body follows rigidly), knees steady
  pelvis_yaw: true           # v5: pelvis faces the lean direction before the hinge (no sideways pelvis roll)
  stance_width_m: 0.30       # v5: ankle-to-ankle width (YMove 'legs apart' is ~0.5 m: the wide rear leg could not bend)
  stance_scale: 0.45         # fore-aft stagger kept from the clip (1.0 = YMove's long split stance = running-stride look)
garment:                     # black boxer briefs (드로즈): separate skinned mesh, matte black, never in the muscle mask
  enabled: true
  z_waist: 1.03
  z_hem: 0.80                # short snug leg (trunks), not baggy shorts
  max_abs_x: 0.22
  offset_m: 0.012
  hem_smooth_iters: 12
  clearance_min_m: 0.0005      # geometric touch = garment vertex within 0.5 mm of the deformed body surface
render:
  dumbbell_axis_fix: true   # v6: handle long axis = object X (v1-v5 bug: the joined dumbbell kept a 90 deg rotation, handle on the wrong axis)
  res: [1080, 1920]          # render at delivery size (720 + upscale measured 0.18x Day 4 sharpness)
  spp: 16
  denoise_prefilter: ACCURATE # OIDN guided by albedo + normal passes keeps the sculpt texture
  normal_strength: 1.5
  denoise: true
  mask_spp: 4
  camera:
    mode: side_tight          # camera on the working-arm side, turned toward the back (Day 4 back-3/4 feel)
    yaw_back_deg: 35
    elev_deg: 14
    lens_mm: 50
    fill_w: 0.90              # figure width / frame width
    feet_y: 0.92              # feet line as a fraction of frame height (title/pill stay above the head)
    top_y: 0.27               # highest figure point: below the Day 4 title box (y 429-491 px = 0.256), v5 (v4 0.22 put the head under the title)
grade:
  out_res: [1080, 1920]
  fps: 30
  loops: 2                    # rep played N times
  detail_amount: 1.0          # unsharp detail pass on the body surface (sigma 1.6)
  detail_sigma: 1.6
  backdrop_rgb: [35, 39, 43]
  target_muscles: [lats, rhomboids, mid_trap]
  glow: right                 # green (correct form)
layout:
  callout:
    metric: torso_from_vertical   # rig-measured (3D), rep median, shown as N°
    l1: TORSO HINGE
    l2: LATS & MID BACK
  preview_pill: true          # Day 4 frosted pill, 1-segment reel = one centred slot (peak thumbnail)
tts:
  line: "Pull the elbow back to your hip. Feel your lats and mid back squeeze."
  question_spoken: "Where do you feel it most?"
caption:
  title: "One-arm dumbbell row: drive the elbow, not the hand."
  question: "Where do you feel your dumbbell rows most right now?"
  save: "Save this for your next back day."
qc:
  torso_band_deg: [35, 60]
  torso_tol_deg: 5
  grip_max_m: 0.03            # dumbbell handle centre vs grip point on the hand bone
  grip_mesh_max_m: 0.06       # nearest hand-mesh vertex to the handle centre
  tear_ratio_max: 3.0         # max deformed/rest edge length
  tear_frac2x_max: 0.003      # fraction of edges stretched > 2x (provisional: a visible lat crease measured 0.0058)
  elbow_rom_min_deg: 40
  skin_p75: [69, 81]
  skin_p90: [81, 95]
  skin_max: 160
  backdrop_tol: 4
  glow_frac: [0.02, 0.30]     # green body pixels / body pixels
  glow_in_mask_min: 0.9
  sharp_rel_min: 0.35         # body Laplacian variance vs the Day 4 master reference
  dur_s: [5, 15]
  safe_zone: [60, 220, 960, 1500]   # x0, y0, x1, y1: IG Reels (top bar, right buttons, bottom caption) for every overlay box
  figure_fill_h_min: 0.62          # v6: figure height / frame height, every frame (no shrinking from camera/overlay fixes)
  glow_frac_max: 0.18              # v6: green area cap (green body px / body px), every frame; Day-4 look sits ~0.13
  overlay_figure_px_max: 0         # v5: figure mask px inside the title / pill text boxes, every frame
  callout_figure_overlap_max: 0.02
  callout_2d_tol_deg: 12            # drawn 2D axis vs shown 3D value (15 deg yaw side camera projection)
  briefs_visible_poke_max: 0.002    # body pixels inside the briefs silhouette / briefs pixels (render)
  briefs_touch_frac_max: 0.03
  briefs_tear_frac2x_max: 0.015     # provisional (body itself 0.25%; briefs inherit the hip-crease stretch)
  briefs_cover_min_rel: 0.6         # briefs pixels every frame >= 0.6 x median
  posture:                          # generic rig-geometry checks (tools/rig3d/posture_qc.py), every exercise; limits per exercise
    neck_line_dev_max_deg: 20       # head-to-torso line vs rest (0 = head continues the spine)
    neck_flex_range_deg: [-20, 15]  # + chin to chest, - head tipped back; a row keeps a neutral neck, slight forward gaze
    head_roll_max_deg: 10           # ear-to-shoulder tilt relative to the chest
    head_yaw_max_deg: 15
    neck_steady_max_deg: 5          # neck flexion max |dev| from its rep median
    toe_lift_max_m: 0.02            # toe base vs floor, both feet, every frame (heel/toe up = not planted)
    foot_pitch_dev_max_deg: 12      # foot pitch vs the rig's rest (flat-foot) pitch
    foot_drift_max_m: 0.015         # ankle / toe base vs per-rep median
    knee_range_deg: [140, 178]      # static split/hinge stance: soft knees, never deep lunge or locked hyper-straight
    knee_steady_max_deg: 6
    knee_soft_range_deg: [150, 170] # v5: soft AND balanced knees (athletic hinge, no locked rear leg)
    knee_lr_diff_max_deg: 20
    handle_palm_max_deg: 15        # v5: handle vs across-palm axis and vs perpendicular-to-forearm, every frame
    handle_body_forward_max_deg: 20 # v5: neutral-grip row: handle runs front-to-back
    support_hand_thigh_max_m: 0.12  # v5: wrist to thigh bone line (thigh radius ~0.07 + hand)
    thigh_split_max_deg: 35         # sagittal angle between the thighs (running stride ~60+)
  anatomy:                          # v6 generic proactive audit (tools/rig3d/anatomy_qc.py)
    joint_ranges:
      elbow_flex_deg: [-5, 150]     # signed (+ flexion as at rest); < -5 = hyperextension
      knee_flex_deg: [-5, 120]
      wrist_dev_max_deg: 35         # hand axis vs forearm
      ankle_dev_max_deg: 25         # shin-foot angle change vs rest
    capsule_penetration_max_m: 0.02
    capsule_allowed_pairs: []       # e.g. [[LeftHand, LeftUpLeg]] for a deliberate brace contact
    com_margin_min_m: 0.0           # whole-body + dumbbell COM inside the feet polygon
    dumbbell_mass_frac: 0.15
    proportion_tol: 0.035           # the CC0 asset's own shins differ 3.2% L/R at rest
    grip:
      finger_wrap_deg: [120, 300]   # each finger's wrap around the handle (knuckle -> tip)
      tip_gap_mm: [-1.5, 5]         # fingertip palmar surface to the handle surface
      thumb_gap_max_mm: 6
      thumb_opposition_min_deg: 90  # thumb tip vs fingertips, around the handle axis
    edge_ratio_max: 3.5             # visible spikes: deformed length / max(rest length, median rest edge 3.6 mm), edges under the shorts excluded
    edge_ratio_min: 0.01            # total collapse only (elbow-crease LBS compression reaches ~0.02-0.03 and is hidden in the fold)
    db_head_visible_min: 0.5        # share of each dumbbell head not hidden by the body
    db_head_sep_min: 1.0            # on-screen head centre distance / head diameter (no stacked heads)
    extremity_margin_px: 24         # head top, fingers, toes, dumbbell heads inside the frame

# Exercise config for tools/rig3d/pipeline.py (0 generations). Edit here; every stage re-runs only if its inputs change.
slug: db_row
module: pull_row          # motion primitive (modules/pull_row.yaml); this file still wins on conflict
kit:
  enabled: true            # reusable CC0 studio kit (modules/kit.yaml)
name: Dumbbell Row            # on-screen title (Day 4 Kaushan title)
source:
  provider: YMove
  page: https://ymove.app/free-exercise-videos
  url: https://ymove.app/api/free/d3fece95-c7e2-4794-ba8f-65a5b3e30a28
  file: _scratch/motion_src/ymove_sa_row.mp4     # gitignored: third-party clip never committed
  licence: "YMove free licence: commercial use incl. social media OK, no resale/redistribution of the videos; we use only the extracted pose"
reference:
  page: https://commons.wikimedia.org/wiki/File:DumbbellBentOverRow.JPG
  image_url: https://upload.wikimedia.org/wikipedia/commons/6/67/DumbbellBentOverRow.JPG
  license: CC BY-SA 3.0
  license_url: https://creativecommons.org/licenses/by-sa/3.0/
  author: GeorgeStepanek
  credit: "GeorgeStepanek / Wikimedia Commons / CC BY-SA 3.0 (model: Emily)"
  note: "Side-view diptych of a bench-supported one-arm DB row (left=hang, right=peak). Linked only; the image is not committed."
  min_bytes: 200000
asset:
  glb: _scratch/assets_probe/human-muscles-rigged.glb   # Grab3D Human Muscles, CC0 1.0 (rig + garment donor)
  ecorche_glb: _scratch/ecorche/ecorche.glb             # Charleeh/ecorche CC BY-SA 4.0; see tools/rig3d/ECORCHE_LICENSE.md
  hdri:
    name: studio_small_09           # Poly Haven, CC0
    url: https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr
    file: _scratch/hdri/studio_small_09_1k.hdr       # gitignored
    strength: 0.55
motion:
  authored:
    enabled: true
    preset: pull_row         # modules/authored/pull_row.yaml (anatomical arm path, eased timing)
    right:
      torso_deg: 88            # override standing hinge; back parallel to the floor
  rep: auto                  # auto = the first full rep (bottom -> bottom) of the working elbow
  rep_index: 0
  torso_target_deg: 88       # flat back roughly parallel to the floor (classic bench-supported row)
  torso_smooth_sigma_f: 4.0
  smooth_sigma_f: 2.5
  lock_feet: true
  spine_influence: 0.5      # spreads the hinge over Spine/Spine01/Spine02 (1.0 stretched 0.58% of edges >2x at the lats)
  spine_aim: far             # v4: spine bones aim 3 torso lengths out along hip->shoulder (legacy shmid: chest swung 7-65 deg)
  neck_mode: spine_follow    # v4: neck aimed along the torso line + gaze_ext_deg, Head keeps its rest relation (legacy: ears_track)
  gaze_ext_deg: 0            # head continues the spine (horizontal, looking at the floor)
  legs: bench_row            # support knee + same-side hand on the pad; working foot on the floor
  knee_target_deg: 152      # athletic soft knee (inherits pull_row construction; was 160 = almost locked)
  balance_knees: true        # v5: each ankle slides fore-aft until its own knee reaches knee_target_deg (no locked rear leg)
  grip_mode: palm_neutral    # v5: handle across the palm (hand-mesh axis) + forearm/hand twisted to a neutral grip (legacy shoulder_line)
  grip_twist_forearm_share: 0.6
  grip_wrap:                 # v6: power grip shape key (tools/rig3d/hand_grip.py): fingers wrap the handle, thumb opposes
    enabled: true
    handle_r_m: 0.016
    clear_m: 0.002
    max_wrap_deg: 250
    mcp_back_m: 0.015        # bend starts this far proximal to the finger web (knuckle line)
  support_elbow_mode: back_out # v6: support elbow points back/out (v5 'lateral' hyperextended it -10 deg)
  support_wrist_neutral: true  # v6: hand continues the forearm onto the thigh (v5: 58 deg wrist bend)
  support_hand_lift_m: 0.075 # support wrist target above the thigh bone line (thigh radius + hand)
  wrist_neutral: true        # v5: working hand not aimed at the index landmark (MediaPipe curled the wrist up to 77 deg)
  support_hand: bench_pad    # support hand locked to the pad (same side as the support knee)
  support_knee: bench_pad     # same-side knee locked to the pad
  support_hand_ahead_m: 0.55  # left hand 55 cm ahead of the left knee on the pad
  bench_pad_z_m: 0.43         # pad top (commercial flat bench ~43 cm)
  lock_hips: true            # v5: pelvis static over the rep (upper body follows rigidly), knees steady
  pelvis_yaw: true           # v5: pelvis faces the lean direction before the hinge (no sideways pelvis roll)
  stance_width_m: 0.30       # v5: ankle-to-ankle width (YMove 'legs apart' is ~0.5 m: the wide rear leg could not bend)
  stance_scale: 0.45         # fore-aft stagger kept from the clip (1.0 = YMove's long split stance = running-stride look)
  stance_mode: feet_forward  # persist 20261105_1017 com_balance auto-fix (COM was 8 cm behind the feet)
garment:                     # closed authored tube + cloth (kit); not copied Grab3D faces
  enabled: true
  method: cloth
  z_waist: 1.03
  z_hem: 0.80                # upper-to-mid thigh openings (boxer-brief length)
  max_abs_x: 0.22
  offset_m: 0.006              # 6 mm rest-pose body offset (3–6 mm fitted shell)
  wrap_offset_m: 0.0           # no nearest shrink-wrap (it tore the crotch/glutes)
  solidify_m: 0.0              # no separate puffy shell
  smooth_factor: 0.5           # soften copied muscle grooves into fabric
  smooth_iters: 6
  lip_offset_frac: 0.40            # keep the hem ~2.4 mm off the skin
  hem_smooth_iters: 12
  clearance_min_m: 0.0005      # geometric touch = garment vertex within 0.5 mm of the deformed body surface
render:
  dumbbell_axis_fix: true   # v6: handle long axis = object X (v1-v5 bug: the joined dumbbell kept a 90 deg rotation, handle on the wrong axis)
  res: [1080, 1920]          # render at delivery size (720 + upscale measured 0.18x Day 4 sharpness)
  spp: 24
  denoise_prefilter: ACCURATE # OIDN guided by albedo + normal passes keeps the sculpt texture
  normal_strength: 0.72           # porcelain: less harsh sculpt grooves
  albedo_detail: 0.06            # keep a hint of fibre, not dirt
  sss_weight: 0.0
  sss_scale: 0.05
  glow_emission: 1.05
  hdri_strength: 0.18            # low-strength Poly Haven studio HDRI
  key_energy: 36                # keep form without clipping the working forearm
  key_size: 3.2
  fill_size: 4.8
  fill_energy: 40                # porcelain fill (Standard still clips the facing forearm)
  rim_energy: 18
  floor: true
  denoise: true
  look_backend: inscene
  bench:
    enabled: true
    look: gunmetal_black
  body_source: grab3d            # smooth painted glow on the one-piece mannequin (ecorche kept, unused)
  view_transform: Standard
  exposure: 0.0             # Standard; positive EV blew highlights
  ambient_strength: 0.14
  top_energy: 14
  ao_distance: 0.11
  ao_amount: 0.14                # porcelain: keep grooves, stop charcoal dirt
  cavity_amount: 0.03            # porcelain: almost no pointiness dirt
  glow_blur_iters: 10
  glow_erode_rings: 0
  glow_fade_rings: 2
  glow_radial: false            # solid interior, short 3-5 px feather (not a wide smear)
  glow_center_power: 1.00
  glow_smooth_iters: 40
  glow_solid_thresh: 0.28
  glow_close_rings: 5
  glow_tint: 0.18               # slight clay tint under the attribute sheets
  glow_opacity: 0.0             # clay BSDF stays; sheets are added emission
  glow_shape: attr              # welded-mesh float attrs; no UVs / projection / shells
  glow_proj_close_px: 9          # morph-close paint alpha (seam holes, not colour flood)
  glow_proj_tex: tools/rig3d/masks/db_row_back_paint.png
  glow_fibre_bump: 0.14             # fibre relief on the still-lit clay
  glow_fibre_line: 0.10         # keep ridges; avoid dark crack lines in the glow
  glow_rim: 0.32
  body_rim: 0.16                 # less white Fresnel wash on clay
  glow_bloom: true
  blender_bloom: 0.70             # demic-like halo on the emission pass
  glow_flex_min: 0.88
  base_color: [0.44, 0.455, 0.485]  # cooler porcelain (kit.clay)
  mask_spp: 4
  camera:
    mode: fixed               # demic: over the working-side shoulder, looking down the back from the head end
    yaw_back_deg: -16         # slightly toward the head so we sit just forward of the working shoulder
    elev_deg: 46
    dist_m: 1.95
    look: [0.20, 0.24, 0.78]  # mid-back
    up: head                  # roll so the head is up and the hips recede down the frame
    lens_mm: 50
    shift_x: 0.12             # pan toward the working arm so the DB stays in frame
    shift_y: -0.08            # lift glow into the upper-middle of the 9:16
    search: false
  camera_fit:                 # side view used only to fit/score against the Commons photo
    mode: fixed
    yaw_back_deg: 6
    elev_deg: 8
    dist_m: 2.45
    look: [0.18, 0.18, 0.60]
    lens_mm: 50
    shift_x: 0.0
    shift_y: -0.08
grade:
  out_res: [1080, 1920]
  fps: 30
  loops: 2                    # rep played N times
  detail_amount: 1.0          # unsharp detail pass on the body surface (sigma 1.6)
  detail_sigma: 1.6
  palette: demic_peach        # legacy COMBO name; NATIVE uses muscle_hues below. Green is UI-only.
  glow_method: NATIVE
  backdrop_rgb: [38, 38, 38]
  target_muscles: [lats, rhomboids, mid_trap, rear_delt]
  muscle_hues:
    lats: {h: 8, s: 210, v: 244}         # vivid peach-orange, V ~0.96
    rhomboids: {h: 141, s: 200, v: 244}  # purple
    mid_trap: {h: 141, s: 200, v: 244}   # purple
    rear_delt: {h: 162, s: 210, v: 242}  # magenta-pink
  muscle_hue_strength:
    lats: 1.00
    rhomboids: 1.00
    mid_trap: 1.00
    rear_delt: 1.00
  glow: right                 # coloured targets (correct form); UI ✓/✗ stay green/red
  look: clay                   # default (inherits _shared); override with charcoal to compare
  fibre_amount: 0.80
  bloom_amount: 0.38
  emission_keep: 0.20
layout:
  callout:
    metric: torso_from_vertical   # rig-measured (3D), rep median, shown as N°
    l1: TORSO HINGE
    l2: LATS & MID BACK
  preview_pill: true          # Day 4 frosted pill, 1-segment reel = one centred slot (peak thumbnail)
tts:
  line: "Pull the elbow back to your hip. Feel your lats and mid back squeeze."
  question_spoken: "Where do you feel it most?"
caption:
  title: "One-arm dumbbell row: drive the elbow, not the hand."
  question: "Where do you feel your dumbbell rows most right now?"
  save: "Save this for your next back day."
qc:
  torso_band_deg: [78, 98]
  torso_tol_deg: 5
  bench_row:
    torso_from_horizontal_max_deg: 10
    head_spine_max_deg: 22
    support_hand_on_pad: true
    knee_on_pad: true
    foot_on_floor: true
    working_hand_drop_min_m: 0.22   # bottom of the rep: hand below the shoulder
    working_hand_hip_max_m: 0.22    # peak: demic squeeze, DB near the hip
    db_in_frame: true
    db_visible_frac_min: 0.35
    db_contrast_v_min: 12
    sil_iou_min: 0.35         # vs letterboxed reference silhouette (different physique)
    joint_mae_max: 0.08       # mean joint error / frame diagonal
    elbow_rom_deg: [40, 170]
    shoulder_over_head: false
    arm_torso_clear_min_m: 0.12
  grip_max_m: 0.03            # dumbbell handle centre vs grip point on the hand bone
  grip_mesh_max_m: 0.06       # nearest hand-mesh vertex to the handle centre
  tear_ratio_max: 3.0         # max deformed/rest edge length
  tear_frac2x_max: 0.003      # fraction of edges stretched > 2x (provisional: a visible lat crease measured 0.0058)
  elbow_rom_min_deg: 40
  skin_p50: [62, 95]
  skin_p75: [68, 110]
  skin_p90: [82, 145]
  skin_max: 215
  look_presets:
    charcoal:
      skin_p50: [62, 95]
      skin_p75: [68, 110]
      skin_p90: [82, 145]
      skin_max: 215
    clay:
      skin_p50: [70, 95]
      skin_p75: [85, 125]
      skin_p90: [100, 160]
      skin_max: 220
  backdrop_tol: 4
  floor_shadow_min: 1.5
  floor_horizon_jump_max: 28      # luma step at the floor's upper silhouette (hard horizon fails)
  floor_luma_delta_max: 24        # receding floor median luma minus backdrop (light-grey floor fails)
  glow_fibre_hp_min: 8.0          # high-pass std of green inside eroded glow core (flat mint blob fails)
  glow_hue: [8, 28]               # demic peach H~16 (palette: green uses [58, 72])
  glow_sat: [40, 110]             # demic peach S~65 (palette: green uses [100, 170])
  glow_frac: [0.02, 0.34]     # green body pixels / body pixels
  glow_in_mask_min: 0.9
  sharp_rel_min: 0.35         # body Laplacian variance vs the Day 4 master reference
  dur_s: [5, 15]
  safe_zone: [60, 220, 960, 1500]   # x0, y0, x1, y1: IG Reels (top bar, right buttons, bottom caption) for every overlay box
  figure_fill_h_min: 0.62          # v6: figure height / frame height, every frame (no shrinking from camera/overlay fixes)
  overlay_figure_px_max: 0         # v5: figure mask px inside the title / pill text boxes, every frame
  callout_figure_overlap_max: 0.02
  callout_2d_tol_deg: 22            # drawn 2D axis vs shown 3D value (15 deg yaw side camera projection)
  briefs_visible_poke_max: 0.002    # body pixels inside the briefs silhouette / briefs pixels (render)
  briefs_touch_frac_max: 0.03
  briefs_tear_frac2x_max: 0.015     # provisional (body itself 0.25%; briefs inherit the hip-crease stretch)
  briefs_cover_min_rel: 0.6         # briefs pixels every frame >= 0.6 x median
  posture:                          # generic rig-geometry checks (tools/rig3d/posture_qc.py), every exercise; limits per exercise
    neck_line_dev_max_deg: 20       # head-to-torso line vs rest (0 = head continues the spine)
    neck_flex_range_deg: [-20, 15]  # + chin to chest, - head tipped back; a row keeps a neutral neck, slight forward gaze
    head_roll_max_deg: 10           # ear-to-shoulder tilt relative to the chest
    head_yaw_max_deg: 15
    neck_steady_max_deg: 5          # neck flexion max |dev| from its rep median
    toe_lift_max_m: 0.02            # toe base vs floor, both feet, every frame (heel/toe up = not planted)
    foot_pitch_dev_max_deg: 12      # foot pitch vs the rig's rest (flat-foot) pitch
    foot_drift_max_m: 0.015         # ankle / toe base vs per-rep median
    knee_range_deg: [70, 178]       # support knee bent on the pad; working knee athletic
    knee_steady_max_deg: 6
    knee_soft_range_deg: [145, 158] # athletic hinge around 152 (v2 160 fails this)
    knee_lr_diff_max_deg: 90
    handle_palm_max_deg: 15        # v5: handle vs across-palm axis and vs perpendicular-to-forearm, every frame
    handle_body_forward_max_deg: 24 # tucked-elbow row: handle stays ~front-to-back (v2 flare path was <=20)
    support_hand_thigh_max_m: 0.55  # bench-supported: hand is on the pad, not the thigh
    thigh_split_max_deg: 35         # sagittal angle between the thighs (running stride ~60+)
  anatomy:                          # v6 generic proactive audit (tools/rig3d/anatomy_qc.py)
    joint_ranges:
      elbow_flex_deg: [-5, 150]     # signed (+ flexion as at rest); < -5 = hyperextension
      knee_flex_deg: [-5, 120]
      wrist_dev_max_deg: 35         # hand axis vs forearm
      ankle_dev_max_deg: 25         # shin-foot angle change vs rest
    capsule_penetration_max_m: 0.02
    capsule_allowed_pairs: [[LeftHand, LeftUpLeg], [LeftForeArm, LeftUpLeg], [RightHand, RightUpLeg], [RightForeArm, RightUpLeg]]
    com_margin_min_m: 0.0           # whole-body + dumbbell COM inside the feet polygon
    dumbbell_mass_frac: 0.15
    proportion_tol: 0.035           # the CC0 asset's own shins differ 3.2% L/R at rest
    grip:
      finger_wrap_deg: [120, 300]   # each finger's wrap around the handle (knuckle -> tip)
      tip_gap_mm: [-1.5, 5]         # fingertip palmar surface to the handle surface
      thumb_gap_max_mm: 6
      thumb_opposition_min_deg: 90  # thumb tip vs fingertips, around the handle axis
    edge_ratio_max: 3.5             # visible spikes: deformed length / max(rest length, median rest edge 3.6 mm), edges under the shorts excluded
    edge_ratio_min: 0.01            # total collapse only (elbow-crease LBS compression reaches ~0.02-0.03 and is hidden in the fold)
    db_head_visible_min: 0.5        # share of each dumbbell head not hidden by the body
    db_head_sep_min: 1.0            # on-screen head centre distance / head diameter (no stacked heads)
    extremity_margin_px: 24         # head top, fingers, toes, dumbbell heads inside the frame

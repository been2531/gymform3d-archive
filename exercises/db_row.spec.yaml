# Machine-readable standards for the bench-supported one-arm dumbbell row.
# QC: tools/rig3d/spec_load.py + tools/rig3d/qc3d.py
# Human template: docs/specs/_TEMPLATE.md
id: db_row
name: Bench one-arm dumbbell row
status: filled
version: 3

pose:
  name: textbook bench-supported one-arm dumbbell row
  ref_fit: false               # authored world targets win over the overlay photo
  side: right_working          # left knee/hand on the pad; right foot on the floor; right arm rows
  reference:
    page: https://commons.wikimedia.org/wiki/File:DumbbellBentOverRow.JPG
    image_url: https://upload.wikimedia.org/wikipedia/commons/6/67/DumbbellBentOverRow.JPG
    license: CC BY-SA 3.0
    license_url: https://creativecommons.org/licenses/by-sa/3.0/
    author: GeorgeStepanek
    credit: "GeorgeStepanek / Wikimedia Commons / CC BY-SA 3.0 (model: Emily)"
    note: >-
      Side-view diptych of a bench-supported one-arm DB row (left = hang, right = peak).
      Linked only; the image is not committed. Use it for overlay QC, not as a pose
      oracle — authored world targets win when the photo drifts from textbook form.
  keyframes:
    bottom:
      working_elbow_deg: [150, 178]     # arm hangs nearly straight under the shoulder
      working_hand_drop_min_m: 0.22     # wrist clearly below the working shoulder
      support_elbow_deg: [160, 180]     # support arm locked long
      support_arm_from_vertical_max_deg: 15
      standing_knee_deg: [150, 170]     # 10–30° of flexion, not locked
      standing_knee_flexion_deg: [10, 30]
    peak:
      working_elbow_deg: [70, 130]      # elbow driven back, not a biceps curl
      working_hand_hip_max_m: 0.34      # DB beside the lower ribs / hip (vertical forearm)
      working_forearm_from_vertical_max_deg: 20
      working_elbow_above_torso_m: [0.0, 0.15]
      working_upper_arm_torso_max_deg: 30
      working_arm_crosses_back: false   # upper arm stays beside the torso, not over the back
      db_below_torso_plane: true        # DB under the back surface, not hidden behind the hip
      elbow_past_torso: true            # elbow at or behind the torso line
      support_elbow_deg: [160, 180]
      support_arm_from_vertical_max_deg: 15
      standing_knee_deg: [150, 170]
      standing_knee_flexion_deg: [10, 30]
  contacts:
    support_hand_on_pad: true           # same-side hand flat on the pad
    support_hand_flat: true             # fingers together, palm flat — not splayed
    support_hand_under_shoulder: true   # hand directly under that shoulder
    support_arm_straight_vertical: true
    support_knee_on_pad: true           # same-side knee on the pad
    support_shin_on_pad: true           # shin rests along the pad, not hanging off
    standing_foot_on_floor: true        # opposite foot planted
    standing_foot_flat: true            # heel and forefoot down; never points up or at the camera
    standing_foot_slightly_wide: true
    standing_knee_soft: true
  alignment:
    torso_from_horizontal_max_deg: 10   # back flat, parallel to the floor
    head_spine_max_deg: 22              # head neutral, in line with the spine (looking at the floor)
    hips_square: true
  faults:
    - rounded or pitched torso (hips stacked above the shoulders)
    - support arm bent, or the hand reaching ahead of the shoulder
    - standing foot pointing up or toward the camera
    - working arm swinging or shrugging; elbow not travelling past the torso at the peak
    - working arm wrapping over the back; forearm along the spine; DB hidden behind the hip
    - splayed support-hand fingers, or the palm not flat on the pad
    - standing knee locked straight or bent past ~30°
    - yanking the torso up to move the dumbbell
    - hips rotating open off the pad

camera:
  mode: fixed
  # Start from the pure side (yaw 0, elev 15) then raise and rotate slightly
  # toward the back so the glow reads without losing the exercise silhouette.
  yaw_back_deg: 18            # 0 = pure working-side; +yaw = behind the side (toward the feet)
  elev_deg: 25
  dist_m: 2.45
  look: [0.18, 0.20, 0.70]
  lens_mm: 50
  shift_x: 0.0
  shift_y: -0.05
  up: world                   # keep the bench horizontal-ish; do not roll head-up
  search: false
  proof:                      # pure-side peak frame, for silhouette / textbook comparison
    yaw_back_deg: 0
    elev_deg: 15
    dist_m: 2.45
    look: [0.18, 0.18, 0.60]
    lens_mm: 50
    shift_x: 0.0
    shift_y: -0.08
    up: world

render:
  frames: keyframes            # beauty stills: bottom + peak; proof camera is extra

notify:
  title: 벤치 원암 로우
  task: 기준 검사

look:
  clay_v: [150, 175]          # body V p50 target (sRGB, Standard view transform)
  clay_clip_max: 250          # nothing in the still may exceed this
  groove_shading: true        # AO + optional cavity so separations read as soft shadows
  muscles:
    lats:       {h: 8,   s: 205, v: 236}   # peach
    rhomboids:  {h: 141, s: 200, v: 240}   # purple
    mid_trap:   {h: 141, s: 200, v: 240}   # purple
    rear_delt:  {h: 162, s: 210, v: 235}   # magenta-pink
  drawers:
    style: black_boxer_briefs
    holes: false
    white_body_show_through: false
    fit: skin_tight_offset_3_to_6mm
    waistband: slim_visible
    leg_opening: upper_to_mid_thigh
  equipment:
    bench: commercial flat bench, black pad, gunmetal frame, no floating parts
    dumbbell: visible, gripped, not clipped out of frame

qc:
  overlay:
    sil_iou_min: 0.35
    joint_mae_max: 0.08       # mean joint error / frame diagonal
  checks:
    - name: torso_horizontal
      label: 등이 바닥에 수평이 아님
      frames: [bottom, peak]
      metric: torso_from_horizontal_deg
      max: 10
    - name: head_spine
      label: 고개가 척추와 안 맞음
      frames: [bottom, peak]
      metric: head_spine_deg
      max: 22
    - name: support_hand_on_pad
      label: 지지 손이 패드에 없음
      frames: [bottom, peak]
      metric: support_hand_on_pad
      equals: true
    - name: support_hand_under_shoulder
      label: 지지 손이 어깨 아래가 아님
      autofix: spec_disable_ref_fit
      frames: [bottom, peak]
      metric: support_hand_under_shoulder
      equals: true
    - name: support_arm_vertical
      label: 지지 팔이 수직이 아님
      autofix: spec_disable_ref_fit
      frames: [bottom, peak]
      metric: support_arm_from_vertical_deg
      max: 15
    - name: knee_on_pad
      label: 지지 무릎이 패드에 없음
      frames: [bottom, peak]
      metric: knee_on_pad
      equals: true
    - name: shin_on_pad
      label: 정강이가 패드에 없음
      autofix: spec_disable_ref_fit
      frames: [bottom, peak]
      metric: shin_on_pad
      equals: true
    - name: foot_on_floor
      label: 서는 발이 바닥에 없음
      frames: [bottom, peak]
      metric: foot_on_floor
      equals: true
    - name: foot_flat
      label: 서는 발이 바닥에 평평하지 않음
      autofix: spec_disable_ref_fit
      frames: [bottom, peak]
      metric: standing_foot_flat
      equals: true
    - name: working_hand_below_shoulder
      label: 무게가 어깨 아래로 안 내려감
      frames: [bottom]
      metric: working_hand_drop_m
      min: 0.22
    - name: working_hand_near_hip
      label: 무게가 엉덩이 옆에 없음
      frames: [peak]
      metric: working_hand_hip_m
      max: 0.34
    - name: elbow_past_torso
      label: 팔꿈치가 몸통을 지나지 않음
      autofix: spec_disable_ref_fit
      frames: [peak]
      metric: elbow_past_torso
      equals: true
    - name: working_elbow
      label: 바닥에서 팔꿈치 각도가 기준 밖
      autofix: spec_disable_ref_fit
      frames: [bottom]
      metric: working_elbow_deg
      min: 150
      max: 178
    - name: working_elbow
      label: 피크에서 팔꿈치 각도가 기준 밖
      autofix: spec_disable_ref_fit
      frames: [peak]
      metric: working_elbow_deg
      min: 70
      max: 130
    - name: db_in_frame
      label: 덤벨이 화면 밖으로 나감
      autofix: spec_camera_pullback
      frames: [bottom, peak]
      metric: db_in_frame
      equals: true
    - name: db_visible
      label: 덤벨이 잘 안 보임
      autofix: spec_camera_pullback
      frames: [bottom, peak]
      metric: db_visible_frac
      min: 0.35
    - name: peak_forearm_vertical
      label: 피크에서 전완이 바닥에 수직이 아님
      frames: [peak]
      metric: working_forearm_from_vertical_deg
      max: 20
    - name: peak_db_below_torso
      label: 피크에서 덤벨 원점이 몸통 아래 10–28cm 구간에 없음
      frames: [peak]
      metric: db_torso_plane_m
      min: -0.28
      max: -0.10
    - name: peak_db_visible
      label: 피크에서 덤벨이 안 보임
      frames: [peak]
      metric: db_visible
      equals: true
    - name: peak_elbow_above_torso
      label: 피크에서 팔꿈치가 몸통 위로 너무 올라가거나 안 올라감
      frames: [peak]
      metric: working_elbow_above_torso_m
      min: 0.0
      max: 0.15
    - name: peak_upper_arm_along_torso
      label: 피크에서 윗팔이 몸통 옆과 나란하지 않음
      frames: [peak]
      metric: working_upper_arm_torso_deg
      max: 30
    - name: peak_arm_no_cross_back
      label: 피크에서 작업팔이 등을 넘어감
      frames: [peak]
      metric: working_arm_crosses_back
      equals: false
    - name: support_hand_flat
      label: 지지 손이 벌어져 있거나 패드에 평평하지 않음
      frames: [bottom, peak]
      metric: support_hand_flat
      equals: true
    - name: standing_knee_soft
      label: 서는 무릎이 너무 펴져 있거나 너무 굽음
      frames: [bottom, peak]
      metric: standing_knee_flexion_deg
      min: 10
      max: 30
    - name: support_palm_pad_contact
      label: 지지 손바닥이 패드에서 떠 있음
      frames: [bottom, peak]
      metric: support_palm_pad_dz_m
      max: 0.02
    - name: support_palm_in_pad
      label: 지지 손이 패드 면적 밖에 있음
      frames: [bottom, peak]
      metric: support_palm_in_pad_xy
      equals: true
    - name: knee_pad_contact
      label: 지지 무릎이 패드에 닿지 않음
      frames: [bottom, peak]
      metric: knee_dz
      min: -0.005
      max: 0.02
    - name: bench_thigh_vertical
      label: 벤치 쪽 허벅지가 수직이 아님
      frames: [bottom, peak]
      metric: bench_thigh_from_vertical_deg
      max: 20
    - name: briefs_gap_max
      label: 드로즈가 몸에서 떠 있음
      frames: [bottom, peak]
      metric: briefs_gap_max_m
      max: 0.01
    - name: briefs_no_zfight
      label: 드로즈가 몸에 파고들거나 깜빡임
      frames: [bottom, peak]
      metric: briefs_poke_frac
      max: 0.05                 # share of verts closer than 0.5 mm; visual poke-through is separate
    - name: briefs_no_holes
      label: 드로즈에 구멍이나 찢어짐이 있음
      frames: [bottom, peak]
      metric: briefs_tear_frac2x
      max: 0.015
    - name: glow_dark_seams
      label: 글로우 안에 검은 균열/솔기가 있음
      source: overlay
      metric: glow_dark_seam_frac
      max: 0.028                # black-hat valleys; 894f762 cracks scored ~0.05
    - name: glow_coverage
      label: 글로우가 등 전체를 덮거나 근육이 붙음
      source: overlay
      metric: glow_coverage_frac
      max: 0.45                 # glow/torso; also requires glow_n_regions >= 2
      min_regions: 2            # 8e1b61c merged sheet = 1 region; 894f762 = 3
    - name: glow_grain
      label: 글로우 안에 근섬유/골 음영이 없음
      source: overlay
      metric: glow_grain
      min: 4.5                  # |med3-med21| std; 894f762 min~5.6 passes, 8e1b61c min~3.8 fails
    - name: sil_iou
      label: 실루엣이 기준 사진과 다름
      source: overlay
      metric: sil_iou
      min: 0.35
      blocking: false             # authored world targets win over the photo (pose.ref_fit: false)
    - name: joint_mae
      label: 관절 위치가 기준 사진과 다름
      source: overlay
      metric: joint_mae_diag
      max: 0.08
      blocking: false
  eye_checklist:
    - bench is visible and reads as a horizontal flat bench
    - head is on screen-left or upper-left in the beauty view, or clearly readable in the side proof
    - back glow is large (lats / mid-back / rear delt as distinct hues)
    - dumbbell is visible and gripped
    - no foot points up or toward the camera
    - the silhouette reads as a bench one-arm row (not a stretch, sit-up, or standing hinge)
    - drawers have no white hole; clay V stays in range and nothing exceeds 250

# rig3d motion playlist (after db_row). GlobeFlip-style reusable queue.
# status: ready | ready_proxy | blocked_needs_motion | done | dropped
# pipeline: nice -n 19 python3 tools/rig3d/pipeline.py --next
# Never commits third-party clips; source.file stays under _scratch/ (gitignored).
# Barbell items use modules/equipment/barbell_olympic.yaml (prop still built; render wiring later).

after: db_row
items:
  - slug: db_goblet_squat
    module: squat_goblet
    name: Dumbbell Goblet Squat
    status: ready
    motion_status: ymove_free
    source_title: Dumbbell Goblet Squat
    ymove_url: https://ymove.app/api/free/a2a797d0-f6f6-436e-8616-6c1d93e73d67
    target_muscles: [quads, glutes]
    fault: knee_cave_chest_drop
    note: "Best next DB: free dumbbell clip on YMove."

  - slug: hammer_curl
    module: curl
    name: Hammer Curls
    status: ready
    motion_status: ymove_free
    source_title: Hammer Curls
    ymove_url: https://ymove.app/api/free/b11e6c6f-b2e8-44ca-95dc-adf0dcd34426
    target_muscles: [biceps, brachialis]
    fault: torso_swing_elbow_drift
    note: "Free DB hammer curl; use as curl primitive (no plain DB curl on YMove free)."

  - slug: db_shoulder_press
    module: press_overhead
    name: Dumbbell Shoulder Press
    status: ready_proxy
    motion_status: ymove_proxy_kb_push_press
    source_title: Kettlebell Push Press
    ymove_url: https://ymove.app/api/free/3880aaa4-e1c0-4153-95d0-da44ea01e099
    target_muscles: [front_delt, side_delt, triceps]
    fault: lumbar_arch_elbow_flare
    note: "No pure DB OHP on YMove free. Proxy = KB push press pose."

  - slug: bb_back_squat
    module: squat_back
    name: Barbell Back Squat
    status: ready
    motion_status: ymove_free
    source_title: Barbell Back Squat
    ymove_url: https://ymove.app/api/free/fd0eaa34-d14b-4421-b41c-1669f93253b3
    prop: barbell_olympic
    target_muscles: [quads, glutes]
    fault: knee_cave_chest_drop
    note: "YMove free #1. Prop module ready; render wiring pending quality-upgrade worker."

  - slug: bb_deadlift
    module: deadlift
    name: Barbell Deadlift
    status: ready
    motion_status: ymove_free
    source_title: Barbell Deadlift
    ymove_url: https://ymove.app/api/free/b59952ca-1551-4c07-835d-ab78bfe9953c
    prop: barbell_olympic
    target_muscles: [hamstrings, glutes, erectors]
    fault: spine_round_hips_shoot
    note: "YMove free #3 conventional DL (not RDL)."

  - slug: bb_bench_press
    module: press_bench
    name: Barbell Bench Press
    status: ready
    motion_status: ymove_free
    source_title: Barbell Bench Press
    ymove_url: https://ymove.app/api/free/dd7e706c-2086-4f4b-867f-d7fece2f720d
    prop: [barbell_olympic, bench_flat]
    target_muscles: [pecs, triceps, front_delt]
    fault: elbow_flare_leg_drive_lose
    note: "YMove free #2. Needs bench_flat + supine retarget before first render."

# Dropped from queue (중현 님 will not film; no free YMove motion)
dropped:
  - slug: db_lunge
    reason: "Not in YMove 25 free; owner will not film."
  - slug: push_up
    reason: "Not in YMove 25 free; owner will not film. Mixamo push-up needs Adobe login — not used."


# Reusable base-asset kit. Merged when kit.enabled is true (exercise opts in).
# All meshes are authored in tools/rig3d/kit/ (CC0). The Poly Haven HDRI is
# fetched into _scratch/hdri/ and is not committed.
_doc: "CC0 studio kit: welded body, attribute glow sheets, closed cloth boxers, porcelain clay, padded bench, knurled DB, studio lights."
kit:
  enabled: false
  licence: CC0-1.0
  weld:
    dist_m: 0.0001               # 0.1 mm world; collapses UV-seam duplicates
  garment:
    method: cloth                # closed authored tube + rest-pose cloth; never copied faces
    waistband_h_m: 0.07          # wide elastic band
    waist_above_hip_m: 0.10
    hem_blend: 0.36              # 0 = at knee, 1 = at hip; ~mid-thigh
    ease_m: 0.006                # default; per-region overrides below
    ease_waist_m: 0.005
    ease_hip_m: 0.005            # rest tube; posed shrinkwrap sits at ~4 mm
    pose_inflate_m: 0.0          # no seat displace (the 10 mm diaper)
    ease_thigh_m: 0.008          # slight looseness at mid-thigh hem only
    clearance_m: 0.003           # post-cloth floor vs the rest body
    posed_fit_offset_m: 0.004    # single-shell shrinkwrap after armature
    cloth_collide_m: 0.005
    waistband_extra_m: 0.006     # band sits a bit proud of the shorts
    solidify_m: 0.003
    waistband_solidify_m: 0.008  # thicker separate elastic ring
    smooth_iters: 6
    rings: 32
    leg_rings: 20
    cloth_frames: 28
    cloth_shrink: 0.010
    matte_rgb: [0.012, 0.012, 0.014]
    roughness: 0.95
  muscles:
    method: attr                 # geodesic float attributes on the welded mesh
    fade_m: 0.015                # 1.5 cm crisp anatomical edge
    hue: {h: 12, s: 200, v: 244} # vivid peach-orange for every shell (not QC identity hues)
    groups:
      - {name: lats, ids: [lats]}
      - {name: mid_back, ids: [rhomboids, mid_trap]}
      - {name: rear_delt, ids: [rear_delt]}
    inflate_m: 0.018
    voxel_m: 0.007
    smooth_iters: 18
    dilate_rings: 2
    edge_min: 0.38
    emission: 1.15
    flex_min: 0.88
  lights:
    hdri_strength: 0.10          # low; area lights shape the form
    ambient_strength: 0.10
    key_energy: 10
    key_size: 5.0
    fill_energy: 6
    fill_size: 5.6
    rim_energy: 6
    rim_size: 2.8
    top_energy: 0                # three-point only
    floor_receive_shadows: false # BSDF on the cyc photographed a circular crease
  clay:
    base_color: [0.44, 0.455, 0.485]   # cooler porcelain, higher value
    ao_amount: 0.14
    ao_distance: 0.10
    cavity_amount: 0.03
    normal_strength: 0.72
    albedo_detail: 0.06
    roughness: 0.72
    body_rim: 0.10
  bench:
    padded: true
    pad_thickness_m: 0.10
    pad_bevel_m: 0.024
  dumbbell:
    knurl: true
    knurl_amp_m: 0.0007
    knurl_around: 14
    knurl_along: 22

# Copied into runtime render/garment so existing readers pick them up.
# Exercise YAML still wins on conflict.
garment:
  method: cloth
render:
  glow_shape: attr
  exposure: 0.0
  hdri_strength: 0.18
  blender_bloom: 0.32
  glow_bloom: true
  glow_opacity: 0.0            # attr sheets add emission; clay stays the BSDF
  glow_tint: 0.18

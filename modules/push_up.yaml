# Primitive: bodyweight push-up (no cable/machine).
primitive: push_up
_doc: "Plank line; elbows tuck ~45°; chest to floor depth."
fault:
  id: hip_sag_elbow_flare
  wrong: "Hips sag / elbows flare 90° — lumbar + shoulder strain."
  right: "Body line locked; elbows tuck; pecs + triceps."

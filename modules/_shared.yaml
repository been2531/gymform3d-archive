# Shared across every rig3d exercise. Exercise YAML and modules/<name>.yaml override.
# Grab3D CC0 body + Poly Haven studio HDRI + Day 4 grade defaults. Never commit the GLB/HDRI/clips.
_doc: "rig3d shared defaults (asset, garment, render, grade, base QC). 0 generations."

asset:
  glb: _scratch/assets_probe/human-muscles-rigged.glb   # Grab3D Human Muscles, CC0 (rig + garment donor)
  ecorche_glb: _scratch/ecorche/ecorche.glb             # Charleeh/ecorche, CC BY-SA 4.0 (separated muscles). Fetch: tools/rig3d/fetch_ecorche.py
  hdri:
    name: studio_small_09
    url: https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr
    file: _scratch/hdri/studio_small_09_1k.hdr
    strength: 0.55

garment:
  enabled: true
  z_waist: 1.03
  z_hem: 0.80
  max_abs_x: 0.22
  offset_m: 0.012
  hem_smooth_iters: 12
  clearance_min_m: 0.0005

motion:
  foot_level: true                 # planted feet: LOCKED_TRACK sole-up to world +Z (no sickle/roll)
  # v3.4: common-mistake take constructed from the SAME free motion via rig offsets (not a generated clip).
  # Activated by motion.form: wrong. Offsets are anatomical and shared by every hinged pull.
  form: right
  authored:
    enabled: false          # per-exercise opt-in (exercises/db_row.yaml)
    fps: 30
  wrong_form:
    torso_rise_deg: 17             # subtract from torso_target_deg (hinged row stands up)
    elbow_path: flare              # opposite of tuck_torso; elbow stays on the 2-bone IK circle
    elbow_flare_max_m: 0.48        # anatomical cap (shoulder-to-hip reach)
    shrug_m: 0.0                   # location/matrix Shoulder shrugs were not neck-or-reach safe; reserved
    round_back_deg: 8              # extra thoracic flexion (Spine + Spine01, world-lateral about bone heads)
    scapula_retract: false         # no mid-back squeeze on the wrong take

render:
  dumbbell_axis_fix: true
  res: [1080, 1920]
  spp: 24
  denoise_prefilter: ACCURATE
  normal_strength: 1.0
  albedo_detail: 0.0
  sss_weight: 0.0
  sss_scale: 0.05
  glow_emission: 0.50
  glow_follow_mesh: true          # paint mregion in a torso-local frame on the deformed mesh
  glow_union_rest: true           # union rest-pose paint (follows verts) with per-frame assign (fills newly visible)
  glow_peak_dilate: 2             # extra mesh-ring growth at peak (kept small; full-target fill is ~0.22 of body)
  glow_flex_min: 0.88             # emission at start = this x peak (peak is always strongest)
  glow_ab: false                  # if true, also render the Blender-native fibre+compositor path as b_*.png
  glow_id_pass: true              # v3.3: render palette ID pass (id_*.png) from rest-pose muscle IDs
  glow_method_d: false            # D remains a selectable preset; default COMBO grades the beauty+ID pass
  sliver_rest_frac: 1.0           # ignore rest edges shorter than this x median when scoring tear_min_ratio
  glow_fibre_scale: 42.0
  blender_bloom: 0.36             # soft halo on glowing muscle meshes
  crease_smooth: true             # cached weight-smooth of Spine/shoulder groups (the crease fix)
  crease_smooth_factor: 0.0       # Corrective Smooth off: v3.1 0.7/12 collapsed edges to ratio 0.0
  crease_smooth_iter: 6
  crease_weight_smooth: 0.5
  crease_weight_smooth_iter: 6
  hdri_strength: 0.0
  key_energy: 75
  fill_energy: 230
  rim_energy: 40
  leg_key_energy: 0               # even studio — no extra leg blast
  leg_rim_energy: 0
  floor: true
  floor_size_m: 6.0
  denoise: true
  look_backend: inscene          # clay Principled + emission; no 2D fibre
  body_source: ecorche           # glow separated muscle meshes (route a); grab3d = painted one-piece skin
  view_transform: Standard       # colours stay as measured (not AgX)
  ambient_strength: 0.38
  top_energy: 50
  ao_distance: 0.14
  ao_amount: 0.38
  glow_blur_iters: 10
  glow_erode_rings: 0            # no shrink; clean_muscle_weight rebuilds a solid silhouette
  glow_fade_rings: 3             # short ~2-3 px rim; interior of each muscle stays at 1
  glow_center_power: 1.0
  glow_smooth_iters: 40          # Laplacian rounds torn atlas-island edges
  glow_solid_thresh: 0.28
  glow_close_rings: 5            # morphological close fills holes inside a muscle
  glow_tint: 0.22                # low: colour comes from emission so form/fibre stay visible
  glow_fibre_bump: 0.42          # wave bump on glow areas (striation)
  glow_rim: 0.42                 # facing rim on glowing muscle meshes
  glow_bloom: true
  base_color: [0.088, 0.089, 0.090]
  mask_spp: 4
  camera:
    mode: side_tight
    yaw_back_deg: 48             # v3.4 constrained search: peak sheet vs hanging-db visibility
    elev_deg: 38
    height_m: 0.12
    shift_m: 0.0
    lens_mm: 50
    fill_w: 0.90
    feet_y: 0.92
    top_y: 0.27
    search: true                 # v3.4: yaw/elev/height + optional working-side shift at peak
    search_yaw_deg: [48, 60, 68, 72, 76, 80]
    search_elev_deg: [14, 22, 30, 38]
    search_height_m: [0.0, 0.12]
    search_shift_m: [0.0, 0.08]

grade:
  out_res: [1080, 1920]
  fps: 30
  loops: 2
  detail_amount: 1.0
  detail_sigma: 1.6
  palette: demic_peach           # default; selectable: green (legacy mint). Green is UI-only in the peach look.
  backdrop_rgb: [38, 38, 38]      # charcoal V~38 (measured demic backdrop V~37-44)
  glow: right
  look: clay                     # default; charcoal remains selectable via look: charcoal
  callout_clear_min_px: 220      # laser/leader clearance from prop (db) keypoints, grade3d solver
  fibre_amount: 0.80             # readable fascicle lines (1.0 = old sticker); mixed with 3D form high-pass
  bloom_amount: 0.38             # edge-weighted bloom (interior fibres preserved; callouts drawn after)
  emission_keep: 0.20            # low: AgX beauty emission is pale mint; form comes from high-pass + fibre
  glow_method: NATIVE            # look is in-Blender; 2D grade is UI only. COMBO remains selectable.
  # Fixed demic-style hue table (OpenCV HSV). An exercise picks targets; override a row to restyle one muscle.
  muscle_hues:
    lats: {h: 10, s: 200, v: 242}         # orange (demic row lats core ~H9 S185 V248)
    rhomboids: {h: 141, s: 220, v: 245}   # purple (demic row mid-back H141 S204 V222)
    mid_trap: {h: 141, s: 220, v: 245}
    upper_trap: {h: 29, s: 140, v: 248}   # yellow/gold
    rear_delt: {h: 162, s: 240, v: 235}   # magenta-pink (demic rear delt H162 S253 V229)
    side_delt: {h: 10, s: 210, v: 235}
    front_delt: {h: 10, s: 200, v: 240}
    biceps: {h: 95, s: 180, v: 230}       # cyan
    triceps: {h: 22, s: 170, v: 245}
    pecs: {h: 66, s: 170, v: 225}         # green
    erectors: {h: 29, s: 150, v: 245}
  muscle_hue_strength:
    lats: 0.82
    rhomboids: 1.15
    mid_trap: 1.15
    rear_delt: 1.05
  glow_activation_floor: 0.58    # E: 0.58 + 0.42 * contraction (start stays a sheet)
  glow_activation_scale: 0.42
  # selectable presets (do not delete): A fibre-on-ID, B x-ray, C neon-outline, D surface-tint
  # also E activation / F energy-flow / G pulse / H compensators / I Fresnel

qc:
  grip_max_m: 0.03
  grip_mesh_max_m: 0.06
  tear_ratio_max: 3.0
  tear_frac2x_max: 0.003
  skin_p50: [62, 95]
  skin_p75: [68, 110]
  skin_p90: [82, 145]
  skin_max: 215
  look_presets:
    charcoal:
      skin_p50: [62, 95]
      skin_p75: [68, 110]
      skin_p90: [82, 145]
      skin_max: 215
    clay:
      skin_p50: [70, 95]
      skin_p75: [85, 125]
      skin_p90: [100, 160]
      skin_max: 220
  backdrop_tol: 4
  floor_shadow_min: 1.5
  floor_horizon_jump_max: 28      # luma step at the floor's upper silhouette (hard horizon fails)
  floor_luma_delta_max: 24        # receding floor median luma minus backdrop (light-grey floor fails)
  glow_fibre_hp_min: 8.0          # high-pass std of green inside eroded glow core (flat mint blob fails)
  glow_hue: [8, 28]               # demic peach H~16 (palette: green uses [58, 72])
  glow_sat: [40, 110]             # demic peach S~65 (palette: green uses [100, 170])
  glow_frac: [0.02, 0.34]
  glow_in_mask_min: 0.9
  sharp_rel_min: 0.35
  dur_s: [5, 15]
  safe_zone: [60, 220, 960, 1500]
  figure_fill_h_min: 0.62
  glow_frac_max: 0.34                 # more-behind/higher camera reveals a larger back sheet; full-target fill is ~0.30 of body
  glow_area_peak_vs_start_min: 0.92   # (green∩target / visible_target)_peak / same_start  (not raw glow area)
  glow_largest_cc_frac_min: 0.60      # 0.90 only from yaw>=72, which hides the hanging db (start vis < 0.5); constrained ceiling ~0.66
  glow_largest_cc_frac_start_min: 0.85  # same metric at start (continuous visible sheet)
  region_contrast_legs_min: 26        # p10(leg luma) - backdrop (v3 charcoal ~20.7)
  muscle_seams_delta_min: 8.0         # interior glow luma - seam luma (borders between muscles)
  nontarget_glow_max: 0.15            # fraction of green pixels on non-target muscle IDs
  overlay_figure_px_max: 0
  callout_figure_overlap_max: 0.02
  callout_2d_tol_deg: 22
  callout_prop_clear_min_px: 220
  briefs_visible_poke_max: 0.002
  briefs_touch_frac_max: 0.03
  briefs_tear_frac2x_max: 0.015
  briefs_cover_min_rel: 0.6
  posture:
    neck_line_dev_max_deg: 20
    neck_flex_range_deg: [-20, 15]
    head_roll_max_deg: 10
    head_yaw_max_deg: 15
    neck_steady_max_deg: 5
    toe_lift_max_m: 0.02
    foot_pitch_dev_max_deg: 12
    foot_drift_max_m: 0.015
    ankle_roll_max_deg: 8            # planted feet: |world-Z of foot local X| (sickle/roll); skipped if legs != planted
  anatomy:
    joint_ranges:
      elbow_flex_deg: [-5, 150]
      knee_flex_deg: [-5, 120]
      wrist_dev_max_deg: 35
      ankle_dev_max_deg: 25
    capsule_penetration_max_m: 0.02
    capsule_allowed_pairs: []
    com_margin_min_m: 0.0
    dumbbell_mass_frac: 0.15
    proportion_tol: 0.035
    grip:
      finger_wrap_deg: [120, 300]
      tip_gap_mm: [-1.5, 5]
      thumb_gap_max_mm: 6
      thumb_opposition_min_deg: 90
      wrist_flex_ext_max_deg: 15
      wrist_deviation_max_deg: 15
      palm_medial_max_deg: 30
      fingers_far_side_min: 0.6
    edge_ratio_max: 3.5
    edge_ratio_min: 0.01
    db_head_visible_min: 0.5
    db_head_sep_min: 1.0
    extremity_margin_px: 24
  # v3.4 wrong-form profile (used when motion.form == wrong). Must PASS: clearly wrong, still possible.
  torso_band_deg_wrong: [22, 40]     # more upright than the hinged ~49° row
  posture_wrong:
    elbow_torso_min_m: 0.34          # flared (right-form max is 0.30)
    # shrug_min_m omitted: a measurable shrug offset was not anatomically safe
    round_back_min_deg: 7
  torso_tol_deg_wrong: 16            # authored yank rises ~13 deg (start 40 -> peak 27)
  motion_smooth:
    joint_jerk_max: 50               # m/s^3 on working arm + head (raw MediaPipe forearm ~302)
    head_jerk_max: 3.0               # MediaPipe Head ~4.14
    foot_slide_mm: 3.0
    head_ang_vel_max_deg_s: 30
    seam_pos_mm: 5.0                 # MediaPipe loop seam ~20 mm
    elbow_lockout_speed_max_deg_s: 160 # 0.8s min-jerk 10→95° crosses flex<25 at ~136°/s; MP snap is 345
